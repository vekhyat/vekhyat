name: Refresh profile activity

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_activity.py
      - scripts/build_static.py
      - .github/workflows/snake.yml

permissions:
  contents: read

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Generate SVGs from public GitHub data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_activity.py --user vekhyat
      - name: Refresh static fallbacks
        run: python3 scripts/build_static.py
      - name: Commit updated activity assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/
          if git diff --cached --quiet; then
            echo 'Activity assets are unchanged.'
            exit 0
          fi
          git commit -m 'Refresh public profile activity'
          git push origin HEAD:main
